[project]
name = "proff58"
version = "0.1.0"
description = "Интернет-магазин «Профессионал» (B2B + B2C) на Django"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]
# scratchpad — одноразовые драйверы и замеры рабочих окон, они хранятся как
# доказательная база операций, а не как код проекта, и стилю не подчиняются.
extend-exclude = "/(scratchpad)/"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "scratchpad"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"
# dev.py выставляет DEBUG=True; keep сохраняет это в тестах (по умолчанию pytest-django
# форсит DEBUG=False). Нужно sourcing-капабилити: DummySource включается только при DEBUG.
# Намеренный командный выбор: DEBUG=True в тестах.
django_debug_mode = "keep"
# parser/ — отдельный инструмент вне Django со своими зависимостями (pydantic,
# playwright) и собственным parser/pytest.ini. В корневой прогон не входит:
# его тесты гоняются из каталога parser/.
norecursedirs = ["parser", "node_modules", "frontend", ".*"]
