name: Deploy

# Деплой запускается ТОЛЬКО после успешного прохождения CI на ветке main.
# Так на сервер не попадёт код с красными тестами/линтом.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Не запускать два деплоя одновременно.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # только если CI завершился успехом
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на VPS по SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
