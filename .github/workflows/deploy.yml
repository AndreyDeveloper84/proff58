name: Deploy

# Деплой по ветке в свою среду:
#   push в dev  → environment "staging"    (staging-стек на VPS)
#   push в main → environment "production" (prod-стек на том же VPS)
# Сначала прогоняются те же тесты (tests.yml), деплой идёт только при зелёных.
on:
  push:
    branches: [main, dev]

# Не запускать два деплоя одной ветки одновременно.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    # Среда выбирается по ветке. Секреты берутся из соответствующего
    # GitHub Environment (production/staging) — они не пересекаются.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Среда настроена?
        id: gate
        env:
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_KEY не задан — деплой пропущен (среда ещё не готова). Добавьте ключ, чтобы включить деплой."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Деплой на VPS по SSH
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Полная пересборка образов (особенно фронт: npm ci + next build) на VPS
          # дольше дефолтных 10m → SSH-команда падала по таймауту («Run Command Timeout»).
          # 30m тоже не хватило: 05.09 два деплоя подряд (33947113373, 33950959287)
          # упёрлись в таймаут на сборке — коробка общая и под нагрузкой, npm-кэш
          # холодный, next build ~17 мин. Обрыв на сборке безопасен, но release.sh
          # (pg_dump + migrate) идёт сразу за ней и вынесен из-под retry — сдвиг
          # на пару минут позже пришёлся бы уже на миграции. ДРФ-1518.
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # BuildKit: переиспользуем слойный кэш между деплоями (cache-mount'ы npm ci и
            # next build в Dockerfile фронта) — при неизменном package-lock.json фронт берётся
            # из кэша, а не пересобирается с нуля по ~17 мин.
            export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
            compose="docker compose -f docker-compose.prod.yml"

            # Сетевые икоты Docker Hub (напр. «load metadata for node:22-slim → TLS handshake
            # timeout») роняли деплой на ровном месте. Оборачиваем тягу и сборку в ретрай с
            # экспоненциальным backoff, чтобы транзиентный сбой реестра не валил весь выкат.
            retry() {
              local n=1 max=3 delay=15
              until "$@"; do
                [ "$n" -ge "$max" ] && { echo "::error::Не удалось после $max попыток: $*"; return 1; }
                echo "::warning::Попытка $n/$max не удалась — повтор через ${delay}с…"
                sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
              done
            }

            # Сборка образов (с BuildKit-кэшем) + тяга под ретраем — транзиентные сбои
            # реестра не валят выкат. Повтор идемпотентен: неизменные слои — из кэша.
            retry $compose build

            # Release-шаг (#441/m-07): бэкап БД + миграции ДО подъёма web. web на старте
            # миграции больше не применяет (только migrate --check), поэтому DDL идёт
            # один раз здесь, а не на каждом рестарте контейнера. НЕ под retry — провал
            # миграции должен ОСТАНОВИТЬ деплой (бэкап уже снят, откат по docs/DEPLOY.md).
            bash docker/release.sh

            # Подъём/обновление сервисов новым образом (web стартует на мигрированной БД).
            # Повтор идемпотентен: уже поднятые контейнеры не трогаются.
            retry $compose up -d --build

            # Привязки фасетов (ДРФ-1524, п.4) — ФАТАЛЬНАЯ проверка на живом дереве.
            # Каждый блок data/attribute_rules.json обязан целиться в существующую
            # категорию. Без --strict-bindings команда молча пропускает выдуманное
            # имя строкой отчёта (action: skip, status: not_found) — так дефект и
            # прожил месяцами: блоки ДРФ-1450 ссылались на узлы, которых в дереве
            # нет, значения писались, а фасетов на витрине не появлялось.
            #
            # ВАЛИТ выкат:
            #   not_found — имени категории нет в дереве (даёт --strict-bindings);
            #   ambiguous — имя резолвится в несколько узлов (фатально по умолчанию,
            #               --allow-ambiguous сознательно НЕ передаём).
            # НЕ валит выкат:
            #   dead_category — привязка легла на неживой узел. Это дефект ДАННЫХ
            #   (узел деактивировали в каталоге), а не словаря в катящемся коммите:
            #   чинится гейт-циклом каталога, а не выкатом. С --strict-live-categories
            #   деактивация одной категории заблокировала бы выкат любого
            #   несвязанного кода — заложник вместо сигнала. Замер на стенде
            #   2026-09-08: dead_category 0, включать нечего. Остаётся ::warning::.
            #
            # Почему это НЕЛЬЗЯ перенести в CI: тамошняя БД — пустой postgres-сервис
            # плюс один `migrate --noinput` (tests.yml), дерева категорий в ней нет,
            # каталог никто не сеет. Все имена рапортовались бы not_found — сигнал
            # стопроцентно ложный. Живое дерево есть только здесь, после `up -d`.
            #
            # Диагностика: команда падает ДО печати плана, поэтому весь разбор
            # (`[not_found] «Имя» → ось: …`, `[ambiguous:tree] …` и текст
            # CommandError со списком имён) уходит в stderr — его и печатаем
            # целиком. Объёмный JSON-план идёт в stdout и лог шага не засоряет.
            la_rc=0
            $compose exec -T web python manage.py load_attributes --dry-run --strict-bindings >/tmp/la-bindings.out 2>/tmp/la-bindings.err || la_rc=$?
            if [ "$la_rc" -ne 0 ]; then
              echo "::error::Привязки фасетов (ДРФ-1524): блоки attribute_rules.json не легли на дерево категорий — выкат остановлен"
              echo "----- load_attributes --dry-run --strict-bindings (stderr) -----"
              cat /tmp/la-bindings.err
              echo "---------------------------------------------------------------"
              exit "$la_rc"
            fi
            # Успех: короткая сводка по привязкам + строки про мёртвые узлы.
            grep -aE "^ПЛАН|^  привязки:|^  из них в мёртвые узлы:|^  ! " /tmp/la-bindings.err || true
            dead=$(grep -ac '"status": "dead_category"' /tmp/la-bindings.out || true)
            if [ "${dead:-0}" -gt 0 ]; then
              echo "::warning::Привязки фасетов: $dead привязок легли на мёртвые узлы (dead_category) — фасета на витрине не будет (ДРФ-1524)"
            fi

            # nginx подключает default.conf через bind-mount: смена содержимого файла НЕ
            # пересоздаёт контейнер автоматически (compose смотрит на спеку, не на содержимое
            # mount) → принудительно проверяем и перечитываем конфиг, иначе изменения маршрутов
            # (напр. headless: / → Next) не применяются и staging выглядит «без изменений».
            $compose exec -T nginx nginx -t && $compose restart nginx

            # Smoke развёрнутого nginx (#424/B-04): строгий default-src 'none' — только для
            # /api|/healthz, витрина/_next/* — рабочая storefront-политика. Гоняем из контейнера
            # web против сервиса nginx внутри compose-сети (curl не нужен, скрипт на stdlib).
            # Проваленная проверка (витрина под 'none' → сломанный рендер) валит деплой.
            retry $compose exec -T web python scripts/smoke_csp.py --base http://nginx
            docker image prune -f
