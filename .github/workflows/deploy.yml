name: Deploy

# Деплой по ветке в свою среду:
#   push в dev  → environment "staging"    (staging-стек на VPS)
#   push в main → environment "production" (prod-стек на том же VPS)
# Сначала прогоняются те же тесты (tests.yml), деплой идёт только при зелёных.
on:
  push:
    branches: [main, dev]

# Не запускать два деплоя одной ветки одновременно.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    # Среда выбирается по ветке. Секреты берутся из соответствующего
    # GitHub Environment (production/staging) — они не пересекаются.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Среда настроена?
        id: gate
        env:
          KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH_KEY не задан — деплой пропущен (среда ещё не готова). Добавьте ключ, чтобы включить деплой."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Деплой на VPS по SSH
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Полная пересборка образов (особенно фронт: npm ci + next build) на VPS
          # дольше дефолтных 10m. #576: ран #565 шёл 33m45s при лимите 30m — ssh-action
          # убивал скрипт ПОСЛЕ git reset, но ДО release/up, оставляя стенд в рассинхроне
          # (checkout новый, миграции не применены, web старый). 60m с запасом.
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # #576 (п.5): лок деплоя. Один деплой единовременно; ручные compose-операции
            # обязаны брать тот же лок (docs/DEPLOY.md) — коллизии «деплой против рук»
            # оставляли стенд в непонятном состоянии. Не ждём дольше 15 минут.
            exec 9>".deploy.lock"
            flock -w 900 9 || { echo "::error::Не удалось взять .deploy.lock за 15 мин — на стенде идёт другой деплой/ручная операция."; exit 1; }
            export DEPLOY_LOCK_HELD=1

            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # #576 (п.4): маркер сборки. SHA попадает в образ (COPY . .), после подъёма
            # сверяется с checkout — честный ответ «web пересоздан из свежего кода».
            git rev-parse HEAD > .build-sha

            # BuildKit: переиспользуем слойный кэш между деплоями (cache-mount'ы npm ci и
            # next build в Dockerfile фронта) — при неизменном package-lock.json фронт берётся
            # из кэша, а не пересобирается с нуля по ~17 мин.
            export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
            compose="docker compose -f docker-compose.prod.yml"

            # Сетевые икоты Docker Hub (напр. «load metadata for node:22-slim → TLS handshake
            # timeout») роняли деплой на ровном месте. Оборачиваем тягу и сборку в ретрай с
            # экспоненциальным backoff, чтобы транзиентный сбой реестра не валил весь выкат.
            retry() {
              local n=1 max=3 delay=15
              until "$@"; do
                [ "$n" -ge "$max" ] && { echo "::error::Не удалось после $max попыток: $*"; return 1; }
                echo "::warning::Попытка $n/$max не удалась — повтор через ${delay}с…"
                sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
              done
            }

            # Сборка образов (с BuildKit-кэшем) + тяга под ретраем — транзиентные сбои
            # реестра не валят выкат. Повтор идемпотентен: неизменные слои — из кэша.
            retry $compose build

            # Release-шаг (#441/m-07): бэкап БД + миграции ДО подъёма web. web на старте
            # миграции больше не применяет (только migrate --check), поэтому DDL идёт
            # один раз здесь, а не на каждом рестарте контейнера. НЕ под retry — провал
            # миграции должен ОСТАНОВИТЬ деплой (бэкап уже снят, откат по docs/DEPLOY.md).
            bash docker/release.sh

            # Подъём/обновление сервисов новым образом (web стартует на мигрированной БД).
            # Повтор идемпотентен: уже поднятые контейнеры не трогаются.
            retry $compose up -d --build

            # nginx подключает default.conf через bind-mount: смена содержимого файла НЕ
            # пересоздаёт контейнер автоматически (compose смотрит на спеку, не на содержимое
            # mount) → принудительно проверяем и перечитываем конфиг, иначе изменения маршрутов
            # (напр. headless: / → Next) не применяются и staging выглядит «без изменений».
            $compose exec -T nginx nginx -t && $compose restart nginx

            # ── #576 (п.4): post-deploy ассерты. НЕ под retry: провал любого — явный
            # failure с точной причиной, а не «success при рассинхроне». ──

            # 1) web пересоздан из СВЕЖЕГО кода: SHA внутри контейнера == checkout.
            #    (`migrate --check` в старом контейнере дал бы ложный успех — старый код
            #    своих миграций не знает; SHA-маркер ловит именно stale web.)
            deployed_sha="$($compose exec -T web cat /app/.build-sha 2>/dev/null || echo MISSING)"
            expected_sha="$(git rev-parse HEAD)"
            if [ "$deployed_sha" != "$expected_sha" ]; then
              echo "::error::web работает НЕ из свежего образа: в контейнере $deployed_sha, checkout $expected_sha — деплой рассинхронизирован."
              exit 1
            fi

            # 2) схема БД синхронна коду web (предохранитель #441 — теперь в самом ране).
            $compose exec -T web python manage.py migrate --check || {
              echo "::error::migrate --check провален: применены не все миграции — release-шаг не отработал."
              exit 1
            }

            # 3) healthz живой (БД+Redis) изнутри web.
            $compose exec -T web python -c "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/', timeout=10).status==200 else 1)" || {
              echo "::error::healthz не отвечает 200 после деплоя."
              exit 1
            }

            # Smoke развёрнутого nginx (#424/B-04): строгий default-src 'none' — только для
            # /api|/healthz, витрина/_next/* — рабочая storefront-политика. Гоняем из контейнера
            # web против сервиса nginx внутри compose-сети (curl не нужен, скрипт на stdlib).
            # Проваленная проверка (витрина под 'none' → сломанный рендер) валит деплой.
            retry $compose exec -T web python scripts/smoke_csp.py --base http://nginx
            docker image prune -f
