name: Tests

# Переиспользуемый пайплайн проверок. Вызывается из ci.yml (на PR)
# и из deploy.yml (на push в dev/main перед деплоем) — без дублирования.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.4.8 black==24.4.2
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .

  frontend:
    # #435 (M-12): обязательный quality gate фронта — lint, unit-тесты, build
    # (next build сам прогоняет ESLint + TypeScript-проверку).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Unit-тесты (vitest)
        run: npm test
      - name: Build (type-check + сборка)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: proff58
          POSTGRES_USER: proff
          POSTGRES_PASSWORD: proff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proff -d proff58"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgres://proff:proff@localhost:5432/proff58
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/dev.txt
      - name: Миграции
        run: python manage.py migrate --noinput
      - name: Тесты
        run: pytest

  catalog-rules-gate:
    # Wave 7.1 / H3: independent machine gate 2.0 на замороженном 7D-sample
    # против DEFAULT ruleset. Exit code команды = статус джобы (0 pass;
    # 1 thresholds; 2 invalid/blocking; 3 internal). Джоба падает при любом
    # дрейфе ruleset / applied corpus / canonical manifest / matcher / метрик.
    # Контур DB-independent (ничего не пишет и не читает в БД) — сервисы не нужны.
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgres://proff:proff@localhost:5432/proff58
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/dev.txt
      # H4: sample перевыпущен на canonical taxonomy binding (TT-07 2026-07-28:
      # 887eea5d…, до этого 524d4e31… (TT-01) и fc13be78…),
      # поблажка --allow-legacy-taxonomy-hash снята из обоих шагов. Джоба
      # проходит только на canonical identity — зелёный CI = полное доказательство.
      - name: Gate — frozen 7D sample против default ruleset
        run: |
          python manage.py catalog_rules_gate_validate \
            --gate-sample apps/catalog/tests/fixtures/phase7d-gate-sample-official.json \
            --labels apps/catalog/tests/fixtures/phase7d-labels.json
      - name: Release manifest — проверка зафиксированной версии контура
        run: |
          python manage.py catalog_rules_release_manifest --check
