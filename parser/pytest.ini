[pytest]
# Парсер живёт вне Django: этот ini отсекает корневой pyproject.toml
# (DJANGO_SETTINGS_MODULE, --reuse-db), чтобы тесты парсера запускались
# автономно: .venv/Scripts/python.exe -m pytest parser/tests -q
testpaths = tests
python_files = test_*.py
markers =
    smoke: реальный headless chromium (about:blank, внешней сети нет)
