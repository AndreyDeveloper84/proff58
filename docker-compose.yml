services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: proff58
      POSTGRES_USER: proff
      POSTGRES_PASSWORD: proff
    # Проброс на хост — чтобы локальный pytest/manage (вне Docker) ходил на localhost:5432.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proff -d proff58"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    # Только дефолтная очередь; 1С-задачи разбирает отдельный celery-onec (-c 1).
    command: celery -A config worker -Q celery -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery-onec:
    build: .
    # Очередь 1С строго последовательно (concurrency=1) — без гонки «одна актуальная цена» (#126).
    command: celery -A config worker -Q onec -c 1 -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  pgdata:
