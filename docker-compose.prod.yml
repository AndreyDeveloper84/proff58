services:
  db:
    image: postgres:16
    restart: always
    # Тюнинг PostgreSQL под объём RAM сервера (через env, дефолты — под 8 ГБ).
    # Дефолтный shared_buffers=128MB мал для каталога: большие категории читаются
    # с диска (особенно HDD) по 20–30 с на первом обращении. ~25% RAM в кэш — стандарт.
    # Сервер с меньшим RAM — переопредели значения в .env (напр. POSTGRES_SHARED_BUFFERS=1GB).
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: always
    command: ["/app/docker/entrypoint.prod.sh"]
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: always
    # Только дефолтная очередь; 1С-задачи разбирает отдельный celery-onec (-c 1).
    command: celery -A config worker -Q celery -l info
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis

  celery-onec:
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: always
    # Очередь 1С строго последовательно (concurrency=1) — без гонки «одна актуальная цена» (#126).
    command: celery -A config worker -Q onec -c 1 -l info
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      # Только на localhost: наружу (80/443, TLS) отдаёт ХОСТОВЫЙ nginx —
      # он проксирует на этот порт. prod: 8081, staging: 8082 (в .env).
      - "127.0.0.1:${WEB_HTTP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  static_volume:
  media_volume:
