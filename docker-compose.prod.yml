services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: always
    command: ["/app/docker/entrypoint.prod.sh"]
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  celery:
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: always
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: .
      args:
        REQUIREMENTS: prod
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    restart: always
    # Публичных портов нет — наружу стек выходит только через общий proxy
    # (docker-compose.proxy.yml) по сети edge. Алиас различает стеки.
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      default: {}
      edge:
        aliases:
          - ${STACK_ALIAS:-proff58_web}

networks:
  # Общая сеть между стеками и фронт-proxy. Создаётся один раз на сервере:
  #   docker network create edge
  edge:
    external: true

volumes:
  pgdata:
  static_volume:
  media_volume:
