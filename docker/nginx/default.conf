# nginx внутри стека: отдаёт static/media, проксирует на gunicorn.
# Стоит за ХОСТОВЫМ nginx (TLS там), поэтому сохраняем исходный X-Forwarded-Proto,
# а не перезаписываем его своим $scheme (иначе Django зациклит SSL-редирект).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    access_log /var/log/nginx/nginx_access.log;
    error_log /var/log/nginx/nginx_error.log;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }
}
