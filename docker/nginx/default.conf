# nginx внутри стека: статику/медиа и API/admin отдаёт Django, остальное — Next (headless).
# Стоит за ХОСТОВЫМ nginx (TLS там), поэтому сохраняем исходный X-Forwarded-Proto,
# а не перезаписываем его своим $scheme (иначе Django зациклит SSL-редирект).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_user_agent"';

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    access_log /var/log/nginx/nginx_access.log timed;
    error_log /var/log/nginx/nginx_error.log;

    # Docker при пересборке пересоздаёт контейнеры (web/frontend) с НОВЫМ внутренним IP.
    # Статический upstream/proxy_pass резолвит хост один раз при старте nginx и кэширует
    # IP → после ребилда nginx упирается в мёртвый адрес и отдаёт 502. Решение: резолвим
    # через встроенный DNS Docker (127.0.0.11) в рантайме — переменная в proxy_pass
    # заставляет ре-резолвить хост каждые valid=, поэтому пересоздание переживается без
    # 502 и без ручного restart nginx. valid= держим низким (3s). НЕ возвращать к 10s.
    resolver 127.0.0.11 valid=3s ipv6=off;

    # Общие заголовки для всех проксируемых апстримов.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;

    # Статика/медиа Django (в т.ч. CSS админки) — из общего тома.
    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        default_type text/plain;
        access_log off;
    }
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # Backend (API-only headless): API, админка, healthcheck → Django.
    location /api/ {
        set $django web;
        proxy_pass http://$django:8000;
    }
    location /admin/ {
        set $django web;
        proxy_pass http://$django:8000;
    }
    location /healthz/ {
        set $django web;
        proxy_pass http://$django:8000;
    }

    # Всё остальное (витрина, /_next/ ассеты) → Next.
    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
}
