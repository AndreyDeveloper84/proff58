# nginx внутри стека: отдаёт static/media, проксирует на gunicorn.
# Стоит за ХОСТОВЫМ nginx (TLS там), поэтому сохраняем исходный X-Forwarded-Proto,
# а не перезаписываем его своим $scheme (иначе Django зациклит SSL-редирект).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

# Лог со временем запроса ($request_time) и апстрима ($upstream_response_time) —
# видно, какой URL и сколько висел, и был ли это таймаут gunicorn.
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_user_agent"';

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    access_log /var/log/nginx/nginx_access.log timed;
    error_log /var/log/nginx/nginx_error.log;

    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        default_type text/plain;
        access_log off;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    location / {
        # Docker при пересборке пересоздаёт контейнер web с НОВЫМ внутренним IP.
        # Статический upstream/proxy_pass резолвит хост один раз при старте nginx и
        # кэширует IP → после ребилда web nginx упирается в мёртвый адрес и отдаёт 502.
        # Решение: резолвим через встроенный DNS Docker (127.0.0.11) в рантайме —
        # переменная в proxy_pass заставляет nginx ре-резолвить хост каждые valid=,
        # поэтому пересоздание web переживается без 502 и без ручного restart nginx.
        # valid= — длительность кэша IP; держим низким (3s), чтобы окно 502 после
        # пересоздания web было коротким. НЕ возвращать к 10s.
        resolver 127.0.0.11 valid=3s ipv6=off;
        set $upstream web;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }
}
