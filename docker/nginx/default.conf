# nginx внутри стека: статику/медиа и API/admin отдаёт Django, остальное — Next (headless).
# Стоит за ХОСТОВЫМ nginx (TLS там), поэтому сохраняем исходный X-Forwarded-Proto,
# а не перезаписываем его своим $scheme (иначе Django зациклит SSL-редирект).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

# CSP по типу маршрута (#424/B-04): строгий default-src 'none' допустим ТОЛЬКО для
# JSON API/healthcheck (браузер не должен исполнять их как HTML/JS). Витрина Next.js
# (HTML, /_next/* ассеты), админка и статика получают рабочую политику — иначе
# default-src 'none' на server-level блокирует storefront (сломанный рендер, CSP violations).
map $uri $content_csp {
    default                 "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'";
    "~^/(api|healthz)(/|$)" "default-src 'none'; frame-ancestors 'self'";
}

log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_user_agent"';

# Edge-лимит API обмена с 1С (#439/m-04): DRF-троттл (scope onec) срабатывает ТОЛЬКО
# после проверки ключа, поэтому brute-force/DoS невалидным ключом долетал до Django без
# ограничения. Режем поток к /api/1c/ на реальном клиентском IP (см. real_ip в server)
# ДО бэкенда — грубый backstop против DoS; точный лимит валидного потока 1С остаётся в
# DRF. rate с запасом под последовательный обмен 1С (worker -c 1), burst гасит всплески.
limit_req_zone $binary_remote_addr zone=onec_edge:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;
    access_log /var/log/nginx/nginx_access.log timed;
    error_log /var/log/nginx/nginx_error.log;

    # Docker при пересборке пересоздаёт контейнеры (web/frontend) с НОВЫМ внутренним IP.
    # Статический upstream/proxy_pass резолвит хост один раз при старте nginx и кэширует
    # IP → после ребилда nginx упирается в мёртвый адрес и отдаёт 502. Решение: резолвим
    # через встроенный DNS Docker (127.0.0.11) в рантайме — переменная в proxy_pass
    # заставляет ре-резолвить хост каждые valid=, поэтому пересоздание переживается без
    # 502 и без ручного restart nginx. valid= держим низким (3s). НЕ возвращать к 10s.
    resolver 127.0.0.11 valid=3s ipv6=off;

    # Стек-nginx стоит за ХОСТОВЫМ nginx (TLS там, см. docs/nginx/*.conf) и снаружи
    # недоступен (порт публикуется на 127.0.0.1). Реальный клиентский IP приходит в
    # X-Forwarded-For от доверенного хостового прокси — восстанавливаем его, чтобы
    # limit_req (edge-лимит 1С), логи и DRF-throttle считали по клиенту, а не по адресу
    # docker-прокси (иначе весь трафик схлопнулся бы в один IP). Доверяем только приватным
    # диапазонам/loopback (хостовый nginx), spoofing извне невозможен — стек закрыт.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Общие заголовки для всех проксируемых апстримов.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;

    # Security-заголовки (#282): защита от MIME-sniffing, clickjacking, утечки referrer,
    # permissions API и базовая CSP (для API/admin; фронт Next.js добавляет свои заголовки).
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "SAMEORIGIN"        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # CSP выбирается по $uri (см. map $content_csp выше): строгий 'none' для API/healthz,
    # рабочая политика для витрины/админки/статики. Так storefront Next.js не ломается (#424).
    add_header Content-Security-Policy $content_csp always;

    # Статика/медиа Django (в т.ч. CSS админки) — из общего тома.
    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
        default_type text/plain;
        access_log off;
    }
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 30d;
    }

    # BFF (#246): корзина, оформление заказа и подсказки поиска идут в Next (frontend),
    # который проксирует в Django серверной стороной и решает session/CSRF. Браузер ходит
    # только в эти same-origin маршруты. Пути — БЕЗ хвостового слэша (Next trailingSlash:false;
    # со слэшем он 308-редиректит и точечный роутинг ломается). exact (=) и regex (~) location
    # приоритетнее префикса /api/ ниже, поэтому остальной /api/ (каталог, 1С, healthcheck)
    # по-прежнему уходит в Django. Детали заказа и B2B-счёт ниже явно направляются
    # в Next-BFF: он сохраняет единый session/cookie-контракт браузера.
    location = /api/cart {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location = /api/cart/items {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location = /api/cart/promo {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location ~ ^/api/cart/items/[0-9]+$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location = /api/orders {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location ~ ^/api/orders/[^/]+/?$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location ~ ^/api/orders/[^/]+/invoice/?$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location = /api/search/suggest {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location = /api/inquiry {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }

    # Аккаунт, MAX-авторизация, уведомления, избранное — это ЦЕЛИКОМ BFF-namespace'ы
    # (session/CSRF решает Next). Префиксом (длиннее /api/ → приоритетнее) ловим и версии
    # со слэшем, и без. ВНИМАНИЕ: любой НОВЫЙ browser-facing эндпоинт с мутацией
    # (POST/PATCH/DELETE) обязан попасть в Next здесь, иначе уйдёт в Django напрямую мимо
    # BFF и мутация упадёт с "CSRF Failed: CSRF token missing" (у apiFetch нет X-CSRFToken).
    location /api/account/ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location /api/auth/ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    # Отмена заказа покупателем: мутация вошедшего — только через BFF, иначе
    # Django отклонит её как «CSRF token missing».
    location ~ ^/api/orders/[^/]+/cancel/?$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    # Оплата заказа: POST-мутация из браузера → строго через BFF (иначе Django
    # ответит «CSRF token missing»). Гостевой токен идёт в ?t=.
    location ~ ^/api/orders/[^/]+/pay/?$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    # Свежее состояние гостевого заказа для страницы «Спасибо» (номер + токен).
    location ~ ^/api/orders/[^/]+/guest/?$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    # Гостевое отслеживание заказа в MAX: старт по номеру заказа и опрос статуса.
    location ~ ^/api/orders/[^/]+/max-track/start$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    location ~ ^/api/orders/max-track/[^/]+/status$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    # Подписка «сообщить о поступлении» на карточке товара (остальной /api/catalog/ → Django).
    location ~ ^/api/catalog/products/[^/]+/availability-subscription/?$ {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
    # Карточки товаров для таблицы сравнения: список выбранного лежит в localStorage
    # браузера, поэтому страницу нельзя собрать на сервере по URL — товары догружает
    # route handler Next. Без этого правила запрос уходил в Django, тот отвечал 404,
    # и страница сравнения показывала «что-то пошло не так».
    location = /api/catalog/compare {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }

    # API обмена с 1С (#439/m-04): edge rate-limit ДО Django. Префикс /api/1c/ длиннее
    # /api/ → приоритетнее, поэтому весь обмен 1С проходит через limit_req. 429 совпадает
    # со статусом DRF-троттла. Опциональный IP-allowlist (когда клиент подтвердит
    # постоянный IP сервера 1С) — раскомментировать allow/deny: тогда edge пустит только 1С.
    location /api/1c/ {
        # allow 203.0.113.10;   # ← IP сервера 1С (подставить и раскомментировать вместе с deny)
        # deny all;
        limit_req zone=onec_edge burst=20 nodelay;
        limit_req_status 429;
        set $django web;
        proxy_pass http://$django:8000;
    }

    # Backend (API-only headless): API, админка, healthcheck → Django.
    location /api/ {
        set $django web;
        proxy_pass http://$django:8000;
    }
    location /admin/ {
        set $django web;
        proxy_pass http://$django:8000;
    }
    location /healthz/ {
        set $django web;
        proxy_pass http://$django:8000;
    }

    # Всё остальное (витрина, /_next/ ассеты) → Next.
    location / {
        set $frontend frontend;
        proxy_pass http://$frontend:3000;
    }
}
