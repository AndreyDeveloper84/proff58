# DRF-2972: stable Django router for rolling deploys.
# NGINX 1.27.3+ supports dynamic DNS resolution for upstream servers in OSS.
# Docker embedded DNS is 127.0.0.11.

upstream django_backend {
    zone django_backend 64k;
    resolver 127.0.0.11 valid=3s ipv6=off;
    resolver_timeout 2s;

    # Slot A keeps the historic service name "web"; slot B is "web-b".
    # max_fails/fail_timeout provide passive temporary exclusion on connect/upstream failure.
    server web:8000 resolve max_fails=1 fail_timeout=5s;
    server web-b:8000 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 8000;
    server_name _;

    location / {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Preserve the request context provided by stack nginx / Next BFF.
        proxy_set_header Host $http_host;

        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Retry another backend only for upstream/connect failures that NGINX
        # considers safe. We intentionally DO NOT enable "non_idempotent":
        # POST/PATCH requests must not be replayed after they may have reached Django.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
