# proff58.ru — боевой домен магазина «Профессионал» (стек proff58-staging, порт 8082).
# На VPS: /etc/nginx/sites-available/proff58.ru (симлинк в sites-enabled). Файл —
# копия боевого конфига на 27.09.2026 плюс маскировка секретов в access-логе (DRF-2482).
# www — 301 на основной домен. Сертификат Let's Encrypt (proff58.ru + www), продление
# через webroot: /.well-known/acme-challenge/ на 80-м порту не редиректить.
# После правок: sudo nginx -t && sudo systemctl reload nginx

# Секреты в query в лог не пишем: одноразовый code колбэка входа через VK ID/Яндекс ID и
# постоянный токен вебхука АТОЛ Pay (?t=). Имена с префиксом proff58_: http-контекст на
# этом сервере общий с другими сайтами. Остаточный риск: error.log при 502/504 пишет
# строку запроса целиком — это нельзя отключить, не потеряв полезные ошибки.
map $request_uri $proff58_log_uri {
    default                                            $request_uri;
    "~^(?<proff58_path>/api/oauth/[^/?]+/callback/?)\?"  "$proff58_path?[hidden]";
    "~^(?<proff58_path>/api/payments/webhook/[^?]*)\?"   "$proff58_path?[hidden]";
}

log_format proff58_main '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $proff58_log_uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name proff58.ru www.proff58.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://proff58.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.proff58.ru;

    ssl_certificate     /etc/letsencrypt/live/proff58.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proff58.ru/privkey.pem;

    return 301 https://proff58.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name proff58.ru;

    ssl_certificate     /etc/letsencrypt/live/proff58.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proff58.ru/privkey.pem;

    client_max_body_size 20M;
    access_log /var/log/nginx/access.log proff58_main;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
