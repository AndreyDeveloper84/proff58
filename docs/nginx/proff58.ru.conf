# Хостовый nginx — production. Положить в /etc/nginx/conf.d/proff58.ru.conf
# Терминирует TLS (cert reg.ru) и проксирует в prod-стек (его nginx на 127.0.0.1:8081).
# После правок: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name proff58.ru www.proff58.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name proff58.ru www.proff58.ru;

    ssl_certificate     /etc/ssl/proff58/fullchain.pem;   # сертификат + промежуточные
    ssl_certificate_key /etc/ssl/proff58/privkey.pem;     # приватный ключ
    # Альтернатива Let's Encrypt:
    # ssl_certificate     /etc/letsencrypt/live/proff58.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/proff58.ru/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
