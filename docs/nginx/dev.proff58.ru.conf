# Хостовый nginx — staging. Положить в /etc/nginx/conf.d/dev.proff58.ru.conf
# Терминирует TLS и проксирует в staging-стек (его nginx на 127.0.0.1:8082).
# После правок: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name dev.proff58.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.proff58.ru;

    ssl_certificate     /etc/ssl/proff58/fullchain.pem;
    ssl_certificate_key /etc/ssl/proff58/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
