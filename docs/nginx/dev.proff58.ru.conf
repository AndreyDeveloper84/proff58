# Хостовый nginx — dev.proff58.ru (старый адрес стенда). Положить в
# /etc/nginx/sites-available/dev.proff58.ru (на сервере лежит там, не в conf.d).
#
# Исключение — API обмена с 1С (/api/1c/): его отдаём напрямую, без 301.
# HTTP-клиент 1С (WinHttpRequest) на 301 повторяет запрос уже методом GET,
# и все POST (подтверждение заказов, цены, остатки) падали с 405: 1С не
# получала подтверждений и заводила один заказ по многу раз, цены на сайт
# не доходили. Правильный адрес для 1С — https://proff58.ru; этот проброс
# нужен, пока в 1С прописан старый.
#
# После правок: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name dev.proff58.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 1С может ходить и по http — до перенастройки на https://proff58.ru
    # ключ и так уходит открытым текстом в первом же запросе, редирект
    # ничего не защищал, а POST ломал.
    location /api/1c/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              proff58.ru;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        return 301 https://proff58.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.proff58.ru;

    ssl_certificate     /etc/letsencrypt/live/dev.proff58.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.proff58.ru/privkey.pem;

    client_max_body_size 20M;

    location /api/1c/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              proff58.ru;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        return 301 https://proff58.ru$request_uri;
    }
}
